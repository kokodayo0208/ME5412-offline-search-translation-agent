<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ME5412 课件查找器</title>
<style>:root{--navy:#123152;--teal:#087f8c;--pale:#eef3f8;--line:#d5e0ea}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:#17324d;font:15px system-ui,"Microsoft YaHei",sans-serif}header{padding:18px 4%;background:var(--navy);color:#fff}h1{margin:0;font-size:28px}header p{margin:7px 0 0;opacity:.86}.tabs,.bar{display:flex;gap:10px;padding:12px 4%;background:#fff;align-items:center}.tabs button,.bar button,.open,.translate-card button{border:0;border-radius:6px;padding:10px 16px;background:var(--teal);color:#fff;cursor:pointer;font-size:15px}.bar button.secondary,.translate-card button.secondary{background:#49718d}.tabs button.off{background:#789}.status{margin-left:auto;color:#456}.bar input,.bar textarea,.translate-card textarea{flex:1;padding:10px;border:1px solid #b8c9d7;border-radius:5px;font-size:16px}.bar textarea,.translate-card textarea{min-height:64px;resize:vertical}.bar button:disabled,.translate-card button:disabled{opacity:.55;cursor:wait}.bar-status,.translation-status{color:#60798e;font-size:12px}.hidden{display:none!important}.layout{display:grid;grid-template-columns:minmax(220px,25%) minmax(440px,50%) minmax(260px,25%);gap:14px;padding:0 4% 18px;height:calc(100vh - 235px);min-height:500px}.panel,.translate-card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;min-height:0}.hit,.detail,.text,.empty,.answer-head{padding:14px}.hit{border-bottom:1px solid #e5edf4;cursor:pointer}.hit:hover,.hit.active{background:#e5f6f7}.meta{font-size:12px;color:#60798e;margin:5px 0}.text{white-space:pre-wrap;line-height:1.65}.detail,.answer-head{border-bottom:1px solid #ddd}.preview{padding:10px;background:#f3f7fa}.preview iframe{width:100%;height:calc(100vh - 400px);min-height:520px;border:1px solid #ccd9e3;background:#fff}.preview-note{padding:14px;color:#567}.modal{position:fixed;inset:0;background:rgba(8,25,42,.78);z-index:20;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}.modal.hidden{display:none}.modal-box{position:relative;width:94vw;height:94vh;background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.modal-head{height:48px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #d5e0ea}.modal-head b{flex:1}.modal-close{border:0;background:#dce7ef;border-radius:5px;padding:7px 12px;cursor:pointer;font-size:18px}.modal-content{display:grid;grid-template-columns:minmax(0,72%) minmax(280px,28%);height:calc(94vh - 48px)}.modal iframe{width:100%;height:100%;border:0}.modal-answer{overflow:auto;border-left:1px solid var(--line)}.translate-layout{max-width:1120px;margin:0 auto;padding:18px 4%}.translate-card{padding:18px;overflow:visible}.translate-card h2{margin:0 0 7px}.translate-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}.translate-card select{padding:10px;border:1px solid #b8c9d7;border-radius:5px;background:#fff;color:#17324d;font-size:15px}.translation-output{min-height:180px;background:#f8fbfd;border:1px solid var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;line-height:1.65}.queue-note{font-size:12px;color:#60798e;margin:8px 0 0}@media(max-width:1050px){.layout{grid-template-columns:minmax(260px,35%) minmax(0,65%)}.answer-panel{grid-column:1/-1;max-height:300px}.modal-content{grid-template-columns:1fr}.modal-answer{display:none}}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}.panel{min-height:360px}.preview iframe{min-height:500px}}</style></head>
<body><header><h1>ME5412 课件查找器</h1><p>先定位笔记版课件页面；需要时再用本地模型生成解析</p></header>
<div class="tabs"><button id="kTab">关键词课件搜索</button><button id="vTab" class="off">图片识字</button><button id="tTab" class="off">离线翻译</button><span id="status" class="status">正在检查本地服务…</span></div>
<section id="courseWorkspace"><form id="kBar" class="bar"><input id="q" placeholder="输入题目、关键词或课件原文"><button type="submit">搜索课件</button><button id="searchCancel" type="button" class="secondary" hidden>取消</button><span id="searchStatus" class="bar-status" aria-live="polite"></span></form>
<form id="aBar" class="bar"><textarea id="question" placeholder="输入完整题目，优先在笔记版课件中定位相关页面"></textarea><button type="submit">定位课件</button><button id="generateExplanation" type="button" class="secondary">生成答案</button><button id="answerCancel" type="button" class="secondary" hidden>取消</button><span id="answerStatus" class="bar-status" aria-live="polite"></span></form>
<form id="vBar" class="bar hidden"><input id="image" type="file" accept="image/*"><input id="prompt" value="请准确识别图片中的全部文字，并解释题目或图表。"><button type="submit">识别</button></form>
<main class="layout"><section id="results" class="panel"><div class="empty">输入关键词或题目后开始定位课件。</div></section><section class="panel"><div id="detail" class="detail"><b>等待搜索</b></div><div id="preview" class="preview"></div><div id="sourceText" class="text"></div></section><section class="panel answer-panel"><div class="answer-head"><b id="answerTitle">答案 / 解析</b><div class="meta">生成答案时不会影响课件预览</div></div><div id="answerText" class="text">课件定位结果会显示在中间，可随时生成答案。</div></section></main></section><section id="translationWorkspace" class="translate-layout hidden"><form id="translationForm" class="translate-card"><h2>离线翻译</h2><p class="meta">译文和进度独立保存；切回课件搜索不会中断翻译。</p><textarea id="translateText" placeholder="输入需要翻译的课件文字、题目或选项"></textarea><div class="translate-controls"><select id="sourceLang"><option value="auto">源语言：自动识别</option><option value="en">源语言：英文</option><option value="zh">源语言：中文</option></select><select id="targetLang"><option value="zh">目标语言：中文</option><option value="en">目标语言：英文</option></select><button id="translateSubmit" type="submit">翻译</button><button id="translateCancel" type="button" class="secondary" hidden>取消翻译</button><span id="translationStatus" class="translation-status" aria-live="polite"></span></div><div id="translationOutput" class="translation-output" aria-live="polite">译文会保留在这里。</div><p class="queue-note">课件检索不使用模型，可立即进行。答案生成与翻译都使用本地模型时，本地运行时可能排队；不承诺并行占用 GPU。</p></form></section><div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><b id="modalTitle">课件预览</b><button class="modal-close" id="closeModal">×</button></div><div class="modal-content"><iframe id="modalFrame"></iframe><section class="modal-answer"><div class="answer-head"><b id="modalAnswerTitle">答案 / 解析</b></div><div id="modalAnswerText" class="text"></div></section></div></div></div>
<script>
const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fileUrl=r=>'/api/file?path='+encodeURIComponent(r.path);let hits=[];function setAnswer(value,title='答案 / 解析'){$('answerTitle').textContent=title;$('modalAnswerTitle').textContent=title;$('answerText').textContent=value;$('modalAnswerText').textContent=value}
// Switching tabs only changes visibility: neither workspace state nor its request is cancelled.
function tab(n){$('kTab').classList.toggle('off',n!=='k');$('vTab').classList.toggle('off',n!=='v');$('tTab').classList.toggle('off',n!=='t');$('courseWorkspace').classList.toggle('hidden',n==='t');$('translationWorkspace').classList.toggle('hidden',n!=='t');$('vBar').classList.toggle('hidden',n!=='v')}$('kTab').onclick=()=>tab('k');$('vTab').onclick=()=>tab('v');$('tTab').onclick=()=>tab('t');
function openPreview(r){if(r.kind!=='PDF')return;$('modalTitle').textContent=r.name+' · 第'+r.page+'页';$('modalFrame').src=fileUrl(r)+'#page='+r.page;$('modal').classList.remove('hidden')}$('closeModal').onclick=()=>{$('modal').classList.add('hidden');$('modalFrame').src=''};$('modal').onclick=e=>{if(e.target===$('modal'))$('closeModal').click()};
function show(i){const r=hits[i];if(!r)return;document.querySelectorAll('.hit').forEach((e,n)=>e.classList.toggle('active',n===i));$('detail').innerHTML='<b>'+esc(r.name)+'</b><div class="meta">'+esc(r.kind)+' · 第'+esc(r.page)+'页</div><button class="open" id="open">放大预览</button>';$('sourceText').textContent=r.text||'';$('preview').innerHTML=r.kind==='PDF'?'<iframe title="课件页面预览" src="'+fileUrl(r)+'#page='+r.page+'"></iframe>':'<div class="preview-note">该文件暂不支持浏览器内逐页预览，请点击“打开原文件”。</div>';$('open').onclick=()=>r.kind==='PDF'?openPreview(r):location.href=fileUrl(r)}
function list(a){hits=a||[];$('results').innerHTML=hits.length?hits.map((r,i)=>'<div class="hit" data-i="'+i+'"><b>'+esc(r.name)+'</b><div class="meta">'+esc(r.kind)+' · 第'+esc(r.page)+'页</div><div>'+esc((r.text||'').replace(/\s+/g,' ').slice(0,260))+'</div></div>').join(''):'<div class="empty">没有匹配内容</div>';document.querySelectorAll('.hit').forEach(e=>e.onclick=()=>show(+e.dataset.i));if(hits.length)show(0)}
// Translation has its own DOM and controller; it never writes course-search panels.
let translationRequest=null;$('translationForm').onsubmit=async e=>{e.preventDefault();const text=$('translateText').value;if(!text.trim()||translationRequest)return;const controller=new AbortController();translationRequest=controller;$('translateSubmit').disabled=true;$('translateCancel').hidden=false;$('translationStatus').textContent='正在离线翻译…';$('translationOutput').textContent='正在处理翻译内容，长文本会自动分段处理…';try{const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,sourceLang:$('sourceLang').value,targetLang:$('targetLang').value}),signal:controller.signal});const d=await r.json();if(!r.ok)throw Error(d.error||'翻译失败');if(translationRequest!==controller)return;$('translationOutput').textContent=d.translation||'未生成翻译';$('translationStatus').textContent='翻译完成（模型：'+(d.model||'本地模型')+'）'}catch(x){if(translationRequest!==controller)return;const cancelled=controller.signal.aborted||x.name==='AbortError';$('translationOutput').textContent=cancelled?'翻译已取消；已输入的原文仍保留。':x.message||'翻译失败';$('translationStatus').textContent=cancelled?'已取消翻译':'翻译失败'}finally{if(translationRequest===controller){translationRequest=null;$('translateSubmit').disabled=false;$('translateCancel').hidden=true}}};$('translateCancel').onclick=()=>translationRequest?.abort('cancelled');
$('vBar').onsubmit=async e=>{e.preventDefault();const f=$('image').files[0];if(!f)return alert('请选择图片');if(f.size>12e6)return alert('图片需小于12MB');$('results').innerHTML='<div class="empty">正在离线识别图片…</div>';const image=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});try{const d=await fetch('/api/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,prompt:$('prompt').value})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x});setAnswer(d.answer||'未生成识别结果','图片识别结果');$('results').innerHTML='<div class="empty">本地识别完成</div>'}catch(x){$('results').innerHTML='<div class="empty">'+esc(x.message)+'</div>'}};
async function refreshAiStatus(){let delay=3000;try{const r=await fetch('/api/ai-status',{cache:'no-store'});if(!r.ok)throw Error('status');const d=await r.json();$('status').textContent=d.ready?'本地模型已就绪：'+d.model:d.available?'本地模型已安装，正在加载或暂未加载':'本地模型服务未就绪或模型未安装';if(d.ready)delay=30000;}catch{$('status').textContent='本地服务未连接';}setTimeout(refreshAiStatus,delay)}refreshAiStatus();
</script></body></html>
